spring.application.name=auth
server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3306/induztek_auth?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.web.error.include-message=always

jwt.secreto=${JWT_SECRET:induztek-clave-secreta-para-firmar-tokens-2026}
jwt.minutos=60

usuarios.service.url=${USUARIOS_URL:http://localhost:8082}

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true