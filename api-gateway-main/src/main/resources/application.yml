server:
  port: 8090

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: ruta-auth
              uri: lb://AUTH
              predicates:
                - Path=/api/auth,/api/auth/**

            - id: ruta-usuarios
              uri: lb://USUARIOS
              predicates:
                - Path=/api/usuarios,/api/usuarios/**

            - id: ruta-empresas
              uri: lb://EMPRESAS
              predicates:
                - Path=/api/empresas,/api/empresas/**

            - id: ruta-equipos
              uri: lb://EQUIPOS
              predicates:
                - Path=/api/equipos,/api/equipos/**

            - id: ruta-protocolos
              uri: lb://PROTOCOLOS
              predicates:
                - Path=/api/protocolos,/api/protocolos/**

            # Documentación OpenAPI de cada microservicio (Swagger unificado)
            - id: docs-auth
              uri: lb://AUTH
              predicates:
                - Path=/docs/auth/v3/api-docs
              filters:
                - RewritePath=/docs/auth/(?<segment>.*), /$\{segment}
                - PreserveHostHeader

            - id: docs-usuarios
              uri: lb://USUARIOS
              predicates:
                - Path=/docs/usuarios/v3/api-docs
              filters:
                - RewritePath=/docs/usuarios/(?<segment>.*), /$\{segment}
                - PreserveHostHeader

            - id: docs-empresas
              uri: lb://EMPRESAS
              predicates:
                - Path=/docs/empresas/v3/api-docs
              filters:
                - RewritePath=/docs/empresas/(?<segment>.*), /$\{segment}
                - PreserveHostHeader

            - id: docs-equipos
              uri: lb://EQUIPOS
              predicates:
                - Path=/docs/equipos/v3/api-docs
              filters:
                - RewritePath=/docs/equipos/(?<segment>.*), /$\{segment}
                - PreserveHostHeader

            - id: docs-protocolos
              uri: lb://PROTOCOLOS
              predicates:
                - Path=/docs/protocolos/v3/api-docs
              filters:
                - RewritePath=/docs/protocolos/(?<segment>.*), /$\{segment}
                - PreserveHostHeader

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

  instance:
    prefer-ip-address: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: auth
        url: /docs/auth/v3/api-docs
      - name: usuarios
        url: /docs/usuarios/v3/api-docs
      - name: empresas
        url: /docs/empresas/v3/api-docs
      - name: equipos
        url: /docs/equipos/v3/api-docs
      - name: protocolos
        url: /docs/protocolos/v3/api-docs

logging:
  level:
    org.springframework.cloud.gateway: DEBUG